[package]
name = "WaweFX"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
rfd = "0.15"
global-hotkey = "0.7"
cpal = "0.18"
rodio = { version = "0.23", default-features = false, features = ["flac", "mp3", "vorbis", "wav"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs"] }
axum = { version = "0.8", features = ["ws"] }
local-ip-address = "0.6"
qrcode = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1.0"
dirs = "6"
tracing = "0.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
