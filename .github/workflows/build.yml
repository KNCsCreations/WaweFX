name: Build WaweFX

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Upload Windows executable
        uses: actions/upload-artifact@v6
        with:
          name: WaweFX-Windows
          path: target/release/WaweFX.exe

  build-macos:
    name: macOS (Universal .dmg)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check compilation without warnings
        run: RUSTFLAGS="-D warnings" cargo check --all-targets

      - name: Run unit tests
        run: cargo test

      - name: Build Apple Silicon release binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel release binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Assemble WaweFX.app and package WaweFX-macOS.dmg
        shell: bash
        run: |
          mkdir -p WaweFX.app/Contents/MacOS WaweFX.app/Contents/Resources
          lipo -create \
            target/aarch64-apple-darwin/release/WaweFX \
            target/x86_64-apple-darwin/release/WaweFX \
            -output WaweFX.app/Contents/MacOS/WaweFX
          chmod +x WaweFX.app/Contents/MacOS/WaweFX
          cp macos/Info.plist WaweFX.app/Contents/Info.plist
          plutil -replace CFBundleIconFile -string AppIcon WaweFX.app/Contents/Info.plist
          printf "APPL????" > WaweFX.app/Contents/PkgInfo
          rm -rf AppIcon.iconset
          if ! cargo test ui::tests::generate_macos_iconset_files -- --ignored --exact; then
            mkdir -p AppIcon.iconset
            sips -z 16 16     assets/logo.png --out AppIcon.iconset/icon_16x16.png
            sips -z 32 32     assets/logo.png --out AppIcon.iconset/icon_16x16@2x.png
            sips -z 32 32     assets/logo.png --out AppIcon.iconset/icon_32x32.png
            sips -z 64 64     assets/logo.png --out AppIcon.iconset/icon_32x32@2x.png
            sips -z 128 128   assets/logo.png --out AppIcon.iconset/icon_128x128.png
            sips -z 256 256   assets/logo.png --out AppIcon.iconset/icon_128x128@2x.png
            sips -z 256 256   assets/logo.png --out AppIcon.iconset/icon_256x256.png
            sips -z 512 512   assets/logo.png --out AppIcon.iconset/icon_256x256@2x.png
            sips -z 512 512   assets/logo.png --out AppIcon.iconset/icon_512x512.png
            sips -z 1024 1024 assets/logo.png --out AppIcon.iconset/icon_512x512@2x.png
          fi
          iconutil -c icns AppIcon.iconset -o WaweFX.app/Contents/Resources/AppIcon.icns
          test -s WaweFX.app/Contents/Resources/AppIcon.icns
          rm -rf AppIcon.iconset
          codesign --force --deep --sign - WaweFX.app
          rm -rf dmg_root
          mkdir -p dmg_root
          mv WaweFX.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "WaweFX" -srcfolder dmg_root -ov -format UDZO WaweFX-macOS.dmg

      - name: Upload macOS DMG installer
        uses: actions/upload-artifact@v6
        with:
          name: WaweFX-macOS
          path: WaweFX-macOS.dmg
